name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + scenario eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The business core (tool layer, retries, idempotency, validation) and the
      # scenario eval run against the mock API in-process and need no cloud keys
      # and no media stack — so CI stays fast and hermetic.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "httpx>=0.27" "pydantic>=2" "pytest>=8" "pytest-asyncio>=0.24" python-dotenv

      - name: Run tests
        run: python -m pytest -q

      - name: Run scenario evaluation
        run: python eval/run_eval.py --mode scripted
