[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-voice-agent"
version = "1.0.0"
description = "Real-time voice AI reservation agent — streaming STT + LLM tool-calling + TTS over WebRTC"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[deepgram,openai,cartesia,silero,webrtc]==1.6.0",
    "pipecat-ai-prebuilt>=1.0.5",
    "openai>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
luma-agent = "luma_agent.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
